<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2c7be5">
  <title>Offline - Base Template</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fa; --card:#fff; --text:#344050; --muted:#5e6e82; --accent:#2c7be5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1727; --card:#162538; --text:#d8e2ef; --muted:#9da9bb; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
           background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .card { background:var(--card); border-radius:12px; padding:32px 24px; max-width:380px; width:100%; text-align:center;
            box-shadow:0 7px 14px rgba(65,69,88,.1),0 3px 6px rgba(0,0,0,.07); }
    img { width:64px; height:64px; margin-bottom:16px; }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    p { margin:0 0 24px; color:var(--muted); line-height:1.5; }
    button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 20px; font-size:.95rem; cursor:pointer; }
    button:focus-visible { outline:3px solid #9ec5fe; outline-offset:2px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/img/favicons/android-chrome-192x192.png" alt="">
    <h1>You're offline</h1>
    <p>Base Template needs a connection to load this page. Check your network, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
